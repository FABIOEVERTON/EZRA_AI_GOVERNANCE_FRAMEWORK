name: Framework Self-Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate framework (validator + pytest + ruff + stamps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run evidence suite (validator + pytest + ruff + stamp)
        id: evidence
        run: bash scripts/run_evidence.sh

      - name: Check file stamps against manifest
        run: python3 scripts/stamp_files.py --check

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      - name: Commit validation manifest back to main
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/validation_manifest.json
          if git diff --cached --quiet; then
            echo "Manifest unchanged, nothing to commit."
          else
            git commit -m "chore(evidence): update validation manifest [skip ci]"
            git push
          fi
